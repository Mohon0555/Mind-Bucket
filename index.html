<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind Bucket</title>
<meta name="description" content="Plan your week in buckets: time for work, study, must-dos and the interests you keep putting off.">
<meta name="theme-color" content="#111111">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mind Bucket">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta property="og:type" content="website">
<meta property="og:title" content="Mind Bucket">
<meta property="og:description" content="Plan your week in buckets: time for work, study, must-dos and the interests you keep putting off.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap">
<style>
/* Layout: black app frame → top bar → rounded grey canvas (main column + side panel) → floating quick-add dock */
:root{
  --frame:#111111; --frame-ink:#FFFFFF; --frame-ink-2:#A1A1A1; --frame-hover:#262626;
  --canvas:#F3F3F3; --surface:#FFFFFF; --subtle:#ECECEC; --muted:#E2E2E2;
  --line:#E2E2E2; --line-strong:#CFCFCF;
  --ink:#111111; --ink-2:#4E4E4E; --ink-3:#6B6B6B;
  --accent:#111111; --on-accent:#FFFFFF;
  --danger:#C62F2F; --danger-bg:#FDECEC;
  --sky-bg:#E1F1FB; --sky-ac:#BEE3F8; --sky-fg:#1D5F86;
  --mint-bg:#DDF6DE; --mint-ac:#B6EBBB; --mint-fg:#1F6B34;
  --butter-bg:#FFF3C4; --butter-ac:#FBE18A; --butter-fg:#6E5300;
  --rose-bg:#FCE1E8; --rose-ac:#F7BFD0; --rose-fg:#9B2C4B;
  --lavender-bg:#EEDFFB; --lavender-ac:#D9BFF5; --lavender-fg:#5E3591;
  --slate-bg:#ECECEC; --slate-ac:#D0D0D0; --slate-fg:#3A3A3A;
  --shadow-sm:0 1px 2px rgba(17,17,17,.06);
  --shadow-md:0 1px 2px rgba(17,17,17,.04),0 8px 20px -4px rgba(17,17,17,.14);
  --overlay:rgba(17,17,17,.4);
  --font:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --frame:#050505; --frame-ink:#F2F2F2; --frame-ink-2:#8F8F8F; --frame-hover:#1E1E1E;
    --canvas:#151515; --surface:#1F1F1F; --subtle:#1A1A1A; --muted:#2C2C2C;
    --line:#2C2C2C; --line-strong:#3D3D3D;
    --ink:#F2F2F2; --ink-2:#BDBDBD; --ink-3:#8F8F8F;
    --accent:#F2F2F2; --on-accent:#111111;
    --danger:#FF8A80; --danger-bg:#3A1A1A;
    --sky-bg:#132A3A; --sky-ac:#25506E; --sky-fg:#A9D8F5;
    --mint-bg:#142B1A; --mint-ac:#25502F; --mint-fg:#A8E6B2;
    --butter-bg:#2D2510; --butter-ac:#5C4A12; --butter-fg:#F5DC8A;
    --rose-bg:#33161F; --rose-ac:#64283A; --rose-fg:#F5B5C7;
    --lavender-bg:#261B36; --lavender-ac:#47336A; --lavender-fg:#DCC4F7;
    --slate-bg:#262626; --slate-ac:#3D3D3D; --slate-fg:#D0D0D0;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 1px 2px rgba(0,0,0,.4),0 10px 24px -4px rgba(0,0,0,.6);
    --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --frame:#050505; --frame-ink:#F2F2F2; --frame-ink-2:#8F8F8F; --frame-hover:#1E1E1E;
  --canvas:#151515; --surface:#1F1F1F; --subtle:#1A1A1A; --muted:#2C2C2C;
  --line:#2C2C2C; --line-strong:#3D3D3D;
  --ink:#F2F2F2; --ink-2:#BDBDBD; --ink-3:#8F8F8F;
  --accent:#F2F2F2; --on-accent:#111111;
  --danger:#FF8A80; --danger-bg:#3A1A1A;
  --sky-bg:#132A3A; --sky-ac:#25506E; --sky-fg:#A9D8F5;
  --mint-bg:#142B1A; --mint-ac:#25502F; --mint-fg:#A8E6B2;
  --butter-bg:#2D2510; --butter-ac:#5C4A12; --butter-fg:#F5DC8A;
  --rose-bg:#33161F; --rose-ac:#64283A; --rose-fg:#F5B5C7;
  --lavender-bg:#261B36; --lavender-ac:#47336A; --lavender-fg:#DCC4F7;
  --slate-bg:#262626; --slate-ac:#3D3D3D; --slate-fg:#D0D0D0;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 1px 2px rgba(0,0,0,.4),0 10px 24px -4px rgba(0,0,0,.6);
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--frame);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{
  height:100%; margin:0; background:var(--frame); color:var(--ink);
  font:400 14px/20px var(--font); display:flex; flex-direction:column; overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1{font-size:30px;line-height:38px;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:22px;line-height:28px;font-weight:500;letter-spacing:-.005em}
h3{font-size:18px;line-height:24px;font-weight:500}
.h2{display:block;font-size:22px;line-height:28px;font-weight:500;letter-spacing:-.005em;color:var(--ink)}
.overline{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2);font-size:13px;line-height:18px}
.faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* tones */
.t-sky{--t-bg:var(--sky-bg);--t-ac:var(--sky-ac);--t-fg:var(--sky-fg)}
.t-mint{--t-bg:var(--mint-bg);--t-ac:var(--mint-ac);--t-fg:var(--mint-fg)}
.t-butter{--t-bg:var(--butter-bg);--t-ac:var(--butter-ac);--t-fg:var(--butter-fg)}
.t-rose{--t-bg:var(--rose-bg);--t-ac:var(--rose-ac);--t-fg:var(--rose-fg)}
.t-lavender{--t-bg:var(--lavender-bg);--t-ac:var(--lavender-ac);--t-fg:var(--lavender-fg)}
.t-slate{--t-bg:var(--slate-bg);--t-ac:var(--slate-ac);--t-fg:var(--slate-fg)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;flex:none;color:var(--frame-ink);padding-inline:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;background:none;border:0;padding:0}
.mark{display:grid;grid-template-columns:12px 12px;gap:4px}
.mark i{width:12px;height:12px;border-radius:4px;display:block}
.nav{display:flex;align-items:center;gap:4px;min-width:0}
.nav button{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:999px;border:0;background:none;color:var(--frame-ink-2);white-space:nowrap}
.nav button:hover{background:var(--frame-hover);color:var(--frame-ink)}
.nav button[aria-current="page"]{color:var(--frame-ink)}
.nav button .lbl{display:none;font-weight:500}
.nav button[aria-current="page"] .lbl{display:inline}
.who{display:flex;align-items:center;gap:12px}
.status{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--frame-hover);color:var(--frame-ink-2);font-size:12px;font-weight:500;background:none;white-space:nowrap}
.status:hover{color:var(--frame-ink)}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--mint-ac)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--lavender-ac);color:var(--lavender-fg);font-size:12px;font-weight:600;border:0}
.top :focus-visible{outline-color:var(--frame-ink)}

/* shell */
.shell{flex:1;min-height:0;background:var(--canvas);border-radius:28px 28px 0 0;display:grid;grid-template-columns:minmax(0,1fr) 368px;overflow:hidden}
.main{overflow-y:auto;padding:32px 32px 120px;display:flex;flex-direction:column;gap:24px;min-width:0}
.panel{overflow-y:auto;background:var(--subtle);padding:32px 24px 120px;display:flex;flex-direction:column;gap:24px;min-width:0}
.panel section{display:flex;flex-direction:column;gap:10px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.phead span{color:var(--ink-2);font-weight:500}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head .ttl{display:flex;flex-direction:column;gap:4px;min-width:0}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nav-group{display:flex;align-items:center;gap:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid transparent;font-weight:500;white-space:nowrap;background:var(--surface);text-decoration:none;color:var(--ink)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{opacity:.88}
.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-secondary:hover{background:var(--subtle)}
.btn-soft{background:var(--mint-bg);color:var(--mint-fg)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--subtle);color:var(--ink)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;gap:6px}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none;text-decoration:none}
.icon-btn:hover{background:var(--subtle)}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.ghost{border-color:transparent;background:var(--subtle);color:var(--ink-2)}
.icon-btn.ghost:hover{background:var(--muted);color:var(--ink)}
.icon-btn.bare{border-color:transparent;background:transparent;color:var(--ink-3)}
.icon-btn.bare:hover{background:var(--subtle);color:var(--ink)}

/* segmented */
.seg{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--muted);flex-wrap:wrap}
.seg button{height:32px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg button .c{color:var(--ink-3);margin-left:4px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;background:var(--t-bg,var(--subtle));color:var(--t-fg,var(--ink-2));white-space:nowrap;border:0}
.chip.outline{background:transparent;border:1px solid var(--line-strong);color:var(--ink-2)}
.chip.dark{background:var(--accent);color:var(--on-accent)}
button.chip{cursor:pointer}
button.chip[aria-pressed="false"]{background:transparent;border:1px solid var(--line-strong);color:var(--ink-2)}

/* cards & common */
.card{background:var(--surface);border-radius:28px;box-shadow:var(--shadow-sm)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--butter-bg);color:var(--butter-fg);border-radius:16px;padding:12px 12px 12px 16px}
.banner p{flex:1;min-width:220px;font-weight:500}
.banner .btn-secondary{border-color:transparent}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px}
.empty p{max-width:52ch}
.tpl{display:flex;gap:8px;flex-wrap:wrap}
.tpl button{height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--t-bg);color:var(--t-fg);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-radius:20px;padding:16px 6px;text-align:center;background:var(--t-bg,transparent)}
.stat.outline{border:1.5px dashed var(--line-strong)}
.stat b{display:block;font-size:28px;line-height:32px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2)}

/* calendar */
.cal-card{padding:16px}
.cal-scroll{overflow-x:auto;overflow-y:hidden}
.cal-grid{display:grid;grid-template-columns:48px repeat(var(--cols),minmax(112px,1fr));column-gap:8px;row-gap:8px}
.cal-grid.day{grid-template-columns:48px minmax(0,1fr)}
.cal-grid.week{min-width:calc(48px + var(--cols) * 120px)}
.dhead{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:999px;border:0;background:transparent;color:var(--ink-2)}
.dhead b{color:var(--ink);font-weight:500}
.dhead:hover{background:var(--subtle)}
.dhead.today{background:var(--accent);color:var(--on-accent)}
.dhead.today b{color:var(--on-accent)}
.axis{position:relative;height:calc(var(--hours) * 48px)}
.axis span{position:absolute;left:0;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-3);transform:translateY(4px)}
.dcol{position:relative;height:calc(var(--hours) * 48px);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 48px);border-bottom:1px solid var(--line)}
.dcol.is-today{background-color:var(--canvas);border-radius:12px}
.blk{position:absolute;left:0;right:0;border-radius:12px;background:var(--t-bg);color:var(--t-fg);padding:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left}
.blk:hover{box-shadow:inset 0 0 0 1.5px var(--t-ac)}
.blk.short{padding:4px 8px;justify-content:center}
.blk.short .blk-title{line-height:18px}
.blk-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk-time{font-size:12px;line-height:16px;font-weight:500;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk-items{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:8px;min-width:0;max-width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:26px;padding:0 10px 0 6px;border-radius:999px;border:0;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--t-fg);font-size:12px;font-weight:500}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .ring{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none}
.pill.done span{text-decoration:line-through;opacity:.7}
.pill.done .ring{background:currentColor}
.pill.done .ring svg{color:var(--t-bg)}
.blk.trip{align-items:flex-start;gap:6px;padding:12px}
.blk.drop-hover,.agenda.drop-hover{box-shadow:inset 0 0 0 2px var(--t-fg)}
.free{position:absolute;left:0;right:0;border:1.5px dashed var(--line-strong);border-radius:12px;background:transparent;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500}
.free:hover{color:var(--ink);border-color:var(--ink-3)}
.now{position:absolute;left:-4px;right:0;height:2px;background:var(--accent);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* agenda */
.agenda{background:var(--t-bg);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:12px}
.agenda-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;color:var(--t-fg);font-weight:500}
.agenda-head .l{display:flex;align-items:center;gap:8px;min-width:0}
.agenda-head .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-head small{font-size:12px;font-weight:500;white-space:nowrap}
.agenda-body{background:var(--surface);border-radius:16px;padding:12px;font-size:13px;line-height:18px;color:var(--ink);display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.agenda-body .line{display:flex;align-items:center;gap:8px}
.agenda-body .line button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;text-align:left;min-width:0}
.agenda-body .line.done span{text-decoration:line-through;color:var(--ink-3)}
button.agenda{border:0;text-align:left;width:100%}
.agenda.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow-md)}

/* checks */
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent;padding:0}
.check:hover{border-color:var(--ink-3)}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* drag items & drop zones */
.drag{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:grab;user-select:none}
.drag:active{cursor:grabbing}
.drag .grip{color:var(--ink-3)}
.drag .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.drag .txt b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drag .txt small{font-size:12px;line-height:16px;color:var(--ink-3)}
.drag .cnt{font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.icirc{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--t-bg);color:var(--t-fg);flex:none}
.icirc.lg{width:44px;height:44px}
.dragging{opacity:.45}
.dz{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;border:1.5px dashed var(--line-strong);border-radius:16px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;text-align:left}
.dz .lbl{flex:1;min-width:0}
.dz small{color:var(--ink-3);font-size:12px;white-space:nowrap}
.dz:hover{border-color:var(--ink-3);color:var(--ink)}
.dz.drop-hover{background:var(--lavender-bg);border-color:var(--lavender-fg);color:var(--lavender-fg)}

/* interests */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.icard{padding:24px;display:flex;flex-direction:column;gap:16px;cursor:grab}
.icard .top-row{display:flex;align-items:center;justify-content:space-between}
.icard h2{overflow-wrap:anywhere}
.icard .txt{display:flex;flex-direction:column;gap:6px;flex:1}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2)}
.prog-row b{color:var(--ink);font-weight:500}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--muted)}
.segs i.done{background:var(--accent)}
.segs i.planned{background:var(--line-strong)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bal{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.bal-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.bal-row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal-track{position:relative;height:8px;border-radius:4px;background:var(--subtle);overflow:hidden}
.bal-track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bal-track i.pl{background:var(--t-ac)}
.bal-track i.dn{background:var(--t-fg)}
.bal-row .v{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* lists */
.capture{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;flex-wrap:wrap;border-radius:20px}
.capture > svg{color:var(--ink-3)}
.capture input[type=text]{flex:1;min-width:180px;height:40px;border:0;background:transparent;outline:none;font-size:14px}
.capture input[type=text]::placeholder{color:var(--ink-3)}
.capture select{height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:13px}
.capture .seg{background:var(--subtle)}
.capture .seg button{height:28px;font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.list-head{display:flex;align-items:center;gap:8px}
.list-head span{color:var(--ink-3);font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;background:var(--surface);border-radius:16px;min-width:0}
.row[draggable="true"]{cursor:grab}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rt b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt small{font-size:12px;line-height:16px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt small.late{color:var(--danger)}
.row.is-done .rt b{text-decoration:line-through;color:var(--ink-3)}
.row .acts{display:flex;align-items:center;gap:4px}
.row.in{background:var(--canvas)}
.list-empty{padding:16px;border-radius:16px;border:1.5px dashed var(--line-strong);color:var(--ink-3);font-size:13px}

.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.cols.one{grid-template-columns:minmax(0,1fr)}
.col{padding:16px;display:flex;flex-direction:column;gap:8px}
.col-head{display:flex;flex-direction:column;gap:4px;padding:4px 4px 8px}
.col-head .r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.col-head .l{display:flex;align-items:center;gap:8px}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px}
.month{display:flex;flex-direction:column;gap:6px}
.mbar{display:flex;gap:2px;height:8px;border-radius:4px;background:var(--subtle);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);font-weight:500}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
.pad{padding:24px;display:flex;flex-direction:column;gap:16px}
.field-inline{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.field-inline input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:40px}
.field-inline svg{color:var(--ink-3)}

/* ideas */
.board{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:24px;align-items:start}
.board .colm{display:flex;flex-direction:column;gap:12px;min-width:0}
.colm-head{display:flex;align-items:center;gap:8px;padding-left:4px}
.colm-head i{width:10px;height:10px;border-radius:50%;background:var(--t-ac);display:block}
.colm-head span{color:var(--ink-3);font-weight:500}
.search{display:flex;align-items:center;gap:8px;height:40px;width:240px;max-width:100%;padding:0 16px;border-radius:999px;background:var(--muted)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0}
.search svg{color:var(--ink-3)}

.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}

.plan.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow-md)}

.plan .foot{padding:0 4px}
.plan .foot small{font-size:12px;color:var(--ink-2);font-weight:500}
.days{display:flex;flex-direction:column;gap:8px}
.dayrow{display:flex;align-items:center;gap:16px;padding:12px;border-radius:16px;background:var(--canvas)}

.badge small{font-size:11px;line-height:14px;font-weight:600}
.badge b{font-size:18px;line-height:22px;font-weight:500}
.dayrow .dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.dayrow input:focus{border-bottom-color:var(--line-strong)}
.dayrow input::placeholder{color:var(--ink-3);font-weight:400}
.dayrow small{font-size:12px;color:var(--ink-3)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border-radius:16px;background:var(--surface);border:0;text-align:left}
.switch .k{width:40px;height:24px;border-radius:999px;background:var(--muted);position:relative;flex:none;transition:background .15s}
.switch .k::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);transition:transform .15s}
.switch[aria-pressed="true"] .k{background:var(--accent)}
.switch[aria-pressed="true"] .k::after{transform:translateX(16px)}
.switch small{display:block;font-size:12px;color:var(--ink-3)}

/* dock */
.dock{position:fixed;z-index:30;bottom:calc(16px + env(safe-area-inset-bottom, 0px));left:calc((100vw - 368px) / 2);transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px;background:var(--frame);box-shadow:var(--shadow-md);border:1px solid var(--frame-hover)}
.dock button{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--t-ac);color:var(--t-fg)}
.dock button:hover{transform:translateY(-2px)}
.dock .plus{background:var(--frame-ink);color:var(--frame)}

.field textarea{height:auto;min-height:88px;padding:10px 14px;resize:vertical;line-height:20px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
fieldset.field{border:0;padding:0;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.opts input:checked + .o{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.icons .o{width:40px;height:40px;padding:0;justify-content:center}

.err{color:var(--danger);font-size:13px;font-weight:500}

.daychips button b{font-size:16px;color:var(--ink);font-weight:500}
.daychips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.pick{display:flex;flex-direction:column;gap:8px}
.pick label{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--t-bg);color:var(--t-fg);cursor:pointer;font-weight:500;border:2px solid transparent}
.pick label:has(input:checked){border-color:var(--t-fg)}
.pick input{accent-color:currentColor}
.pick small{margin-left:auto;font-size:12px;opacity:.85}
.note{font-size:13px;line-height:18px;color:var(--ink-2);background:var(--subtle);border-radius:12px;padding:12px}
.chooser{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.chooser button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;border:0;background:var(--t-bg);color:var(--t-fg);font-weight:500;text-align:left}

/* toast */
#toast{position:fixed;z-index:60;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:999px;font-weight:500;box-shadow:var(--shadow-md);max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast:empty{display:none}

/* responsive */
@media (max-width: 1180px){
  .top .status .t{display:none}
}
@media (max-width: 1080px){
  .shell{grid-template-columns:minmax(0,1fr);overflow-y:auto}
  .main{overflow:visible;padding-bottom:16px}
  .panel{overflow:visible;background:transparent;padding:8px 32px 120px}
  .dock{left:50%}
}
@media (max-width: 860px){
  .nav button{padding:0 10px}
  .nav button[aria-current="page"] .lbl{display:none}
  .logo .name{display:none}
}
@media (max-width: 640px){
  .top{padding-inline:0;gap:8px}

  .nav button{padding:0 8px;height:36px}

  .shell{border-radius:20px 20px 0 0}
  .main{padding:20px 16px 12px;gap:20px}

  h1{font-size:26px;line-height:32px}

  .board{grid-template-columns:minmax(0,1fr)}

  .icard{padding:20px}
  .search{width:100%}

  .row .acts .hide-sm{display:none}
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:24px 24px 0 0;max-height:92%}
}
@media (max-width: 400px){
  .nav button{padding:0 6px}
  .status{padding:0 8px}
}

function migrate(d) {

  for (const k of ['buckets','interests','sessions','todos','purchases','ideas','plans']) out[k] = Array.isArray(d[k]) ? d[k] : [];

  out.sample = !!d.sample; out.updatedAt = Number(d.updatedAt) || 0; out.version = 1;
  out.plans.forEach(p => { p.days = Array.isArray(p.days) ? p.days : []; p.checklist = Array.isArray(p.checklist) ? p.checklist : []; });
  out.buckets.forEach(b => { b.days = Array.isArray(b.days) ? b.days.map(Number) : []; });
  return out;
}

/* ---------------- domain helpers ---------------- */
function weekDates(off) { const s = addDays(startOfWeek(today0(), S.settings.weekStart), off * 7); return Array.from({ length:7 }, (_, i) => addDays(s, i)); }
function tripOn(d) { const k = ymd(d); return S.plans.find(p => p.pause && p.start && p.end && k >= p.start && k <= p.end) || null; }
function occurrencesOn(d) {

}
function sessionsFor(bid, k) { return S.sessions.filter(s => s.bucketId === bid && s.date === k); }
function refOf(s) { return s.kind === 'interest' ? byId(S.interests, s.refId) : s.kind === 'todo' ? byId(S.todos, s.refId) : byId(S.ideas, s.refId); }

  if (s.kind === 'todo') return r.title;

}
function interestWeek(i) {

  const done = ss.filter(s => s.done).length;

}

}

/* ---------------- mutations ---------------- */
function commit(fn, msg) { fn(); save(); render(); if (msg) toast(msg); }
function schedule(kind, id, bid, k) {
  const b = byId(S.buckets, bid); const r = kind === 'interest' ? byId(S.interests, id) : kind === 'todo' ? byId(S.todos, id) : byId(S.ideas, id);
  if (!b || !r) return;
  if (S.sessions.some(s => s.kind === kind && s.refId === id && s.bucketId === bid && s.date === k)) { toast('Already in that bucket'); return; }
  commit(() => {
    S.sessions.push({ id:uid(), kind, refId:id, bucketId:bid, date:k, done:false });
    if (kind === 'todo') r.due = k;
    if (kind === 'idea' && r.status === 'new') r.status = 'planned';
    if (kind === 'interest' && r.level === 'parked') r.level = 'maintain';
  }, `${kind === 'interest' ? r.name : kind === 'todo' ? r.title : 'Idea'} added to ${b.name} · ${fmtDay(parseYmd(k))}`);
}

  const s = byId(S.sessions, sid); if (!s) return;
  commit(() => {
    s.done = !s.done;
    const r = refOf(s);
    if (r && s.kind === 'todo') { r.done = s.done; r.doneAt = s.done ? Date.now() : null; }
    if (r && s.kind === 'idea' && s.done) r.status = 'done';

  commit(() => {
    td.done = !td.done; td.doneAt = td.done ? Date.now() : null;

      <section class="field"><span>Backup</span><textarea id="f-export" readonly rows="3" aria-label="Backup data">${esc(JSON.stringify(S))}</textarea><div class="tpl"><button type="button" class="btn btn-secondary btn-sm" data-act="download-export">Download backup file</button><button type="button" class="btn btn-ghost btn-sm" data-act="copy-export">Copy as text</button></div></section>

      <div class="mfoot"><div class="tpl"><button type="button" class="btn btn-ghost btn-sm" data-act="load-sample">Load the sample week</button><button type="button" class="btn btn-ghost btn-sm" data-act="clear-all">${icon('trash', 16)}<span>Clear everything</span></button></div><div class="r"><button type="button" class="btn btn-primary" data-act="close-modal">Done</button></div></div></div>`;

function openModal(m) {

let toastTimer;

function go(view) { if (!VIEWS.some(v => v.id === view)) view = 'calendar'; UI.view = view; if (location.hash.slice(1) !== view) { try { history.replaceState(null, '', '#' + view); } catch (e) { location.hash = view; } } const m = $('#main'), p = $('#panel'), s = $('#shell'); render(); [m, p, s].forEach(x => { if (x) x.scrollTop = 0; }); }

function armed(el, label) { if (el.dataset.armed) return true; el.dataset.armed = '1'; const sp = el.querySelector('span') || el; sp.textContent = label || 'Tap again to confirm'; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; } }, 4000); return false; }

    case 'sch-day': UI.modal.date = el.dataset.date; renderModal(); break;

    case 'p-filter': UI.pFilter = el.dataset.v; render(); break;

    case 'select-idea': UI.ideaSel = UI.ideaSel === id ? null : id; render(); if (UI.ideaSel && window.matchMedia('(max-width: 1080px)').matches) { const p = $('#panel'); if (p) p.scrollIntoView({ behavior:'smooth' }); } break;
    case 'close-idea': UI.ideaSel = null; render(); break;

    case 'idea-to-todo': { const d = byId(S.ideas, id); if (!d) break; commit(() => { S.todos.push({ id:uid(), title:d.text, tag:'General', due:null, done:false, doneAt:null, createdAt:Date.now() }); if (d.status === 'new') d.status = 'planned'; }, 'Added to To-do · Later'); break; }

    case 'delete-bucket': if (!armed(el)) break; commit(() => { S.buckets = S.buckets.filter(x => x.id !== id); S.sessions = S.sessions.filter(s => s.bucketId !== id); }, 'Bucket deleted'); closeModal(); break;
    case 'copy-export': { const ta = $('#f-export'); const txt = ta ? ta.value : JSON.stringify(S); const done = () => toast('Backup copied'); const fallback = () => { if (ta) { ta.focus(); ta.select(); } toast('Select all and copy the text'); };
      try { const pr = navigator.clipboard && navigator.clipboard.writeText(txt); if (pr && pr.then) pr.then(done, fallback); else fallback(); } catch (err) { fallback(); } break; }

function formErr(f, msg) { const p = f.querySelector('.err'); if (p) p.textContent = msg; }
function submit(type, f, e) {
  const fd = new FormData(f); const g = k => String(fd.get(k) || '').trim();

    case 'bucket': {

      if (!days.length) return formErr(f, 'Pick at least one day.');
      const id = UI.modal.id;
      commit(() => { if (id) Object.assign(byId(S.buckets, id), { name, start, end, days, tone: g('tone') || 'lavender' }); else S.buckets.push({ id:uid(), name, start, end, days, tone: g('tone') || 'lavender' }); }, id ? 'Bucket saved' : `${name} added`);
      closeModal(); break;

    case 'occ-add': {

      const { bid, date } = UI.modal; schedule(kind, rid, bid, date); renderModal(); break;
    }
    case 'schedule': {
      const bid = g('bid'); if (!bid) return formErr(f, 'Pick a bucket first.');

    }
    case 'interest': {
      const name = g('name'); if (!name) return formErr(f, 'Give it a name.');
      const per = Math.min(7, Math.max(1, Number(g('perWeek')) || 1)); const minutes = Math.min(300, Math.max(5, Number(g('minutes')) || 30));
      const data = { name, note: g('note'), level: g('level') || 'maintain', perWeek: per, minutes, icon: g('icon') || 'star', tone: g('tone') || 'lavender' };

      const id = UI.modal.id;
      commit(() => { if (id) Object.assign(byId(S.interests, id), data); else S.interests.push(Object.assign({ id:uid() }, data)); }, id ? 'Interest saved' : `${name} added`);
      closeModal(); break;
    }

      if (when === 'today') due = k; else if (when === 'date') { due = g('date'); if (!due) return formErr(f, 'Pick a date, or choose Today or Later.'); }
      const id = UI.modal.id;
      commit(() => { if (id) Object.assign(byId(S.todos, id), { title, tag: g('tag') || 'General', due }); else S.todos.push({ id:uid(), title, tag: g('tag') || 'General', due, done:false, doneAt:null, createdAt:Date.now() }); }, id ? 'To-do saved' : 'To-do added');
      closeModal(); break;
    }
    case 'todo-capture': {
      const title = g('title'); if (!title) return;
      commit(() => { S.todos.push({ id:uid(), title, tag: g('tag') || 'General', due: UI.todoWhen === 'today' ? ymd(today0()) : null, done:false, doneAt:null, createdAt:Date.now() }); }, UI.todoWhen === 'today' ? 'Added to Today' : 'Added to Later');
      const inp = document.getElementById('cap-todo'); if (inp) { inp.value = ''; inp.focus(); } break;
    }
    case 'purchase': {
      const name = g('name'); if (!name) return formErr(f, 'Name the item.');
      const link = g('link'); if (link && !safeLink(link)) return formErr(f, 'That link does not look right. Paste the full address.');
      const data = { name, kind: g('kind') || 'need', price: Math.max(0, Number(g('price')) || 0), month: g('month'), link: link ? safeLink(link) : '', note: g('note') };
      const id = UI.modal.id;
      commit(() => { if (id) Object.assign(byId(S.purchases, id), data); else S.purchases.push(Object.assign({ id:uid(), bought:false }, data)); }, id ? 'Item saved' : `${name} added to ${data.kind === 'need' ? 'Need' : 'Want'}`);
      closeModal(); break;

    }
  }
}
function change(type, el) {
  switch (type) {
    case 'plan-day': { const p = byId(S.plans, el.dataset.id); if (!p) return; const i = Number(el.dataset.i); while (p.days.length <= i) p.days.push(''); p.days[i] = el.value.trim(); save(); break; }

    case 'set-start': S.settings.dayStart = Number(el.value); save(); render(); break;
    case 'set-end': S.settings.dayEnd = Number(el.value); save(); render(); break;

  const t = e.target.closest && e.target.closest('[data-drop]'); if (!t || !DRAG) return;

  schedule(d.kind, d.id, bid, k);
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== UI.view && VIEWS.some(x => x.id === v)) go(v); });
setInterval(() => {
  const grid = document.querySelector('.cal-grid'); const now = document.querySelector('.now'); if (!grid || !now) return;
  const h0 = Number(grid.dataset.h0); const n = new Date(); const m = n.getHours() * 60 + n.getMinutes();
  now.style.top = ((m - h0 * 60) / 60 * HR) + 'px';
}, 60000);

const hv = location.hash.slice(1); if (VIEWS.some(v => v.id === hv)) UI.view = hv;
renderDock();

})();
